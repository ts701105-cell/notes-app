plugins { id 'com.android.application' }
def vc = (System.getenv('VERSION_CODE') ?: '1') as Integer
android {
  namespace 'com.ts701105.cloudnotes'
  compileSdk 35
  defaultConfig {
    applicationId 'com.ts701105.cloudnotes'
    minSdk 21
    targetSdk 35
    versionCode vc
    versionName "1.0.${vc}"
  }
  /* 固定簽章:之後每次更新都能直接覆蓋安裝,不用先移除 */
  signingConfigs {
    release { storeFile file('../release.keystore'); storePassword 'cloudnotes'; keyAlias 'cloudnotes'; keyPassword 'cloudnotes' }
  }
  buildTypes { release { minifyEnabled false; signingConfig signingConfigs.release } }
  compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies { implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0' }
