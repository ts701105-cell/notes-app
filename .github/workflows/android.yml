name: 打包 Android APK
on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - name: Android SDK
        run: echo "ANDROID_HOME=$ANDROID_HOME" && ls "$ANDROID_HOME/platforms"
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - name: Build APK
        working-directory: android
        env: { VERSION_CODE: '${{ github.run_number }}' }
        run: |
          gradle --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk ../CloudNotes.apk
      - uses: actions/upload-artifact@v4
        with: { name: CloudNotes-apk, path: CloudNotes.apk }
      - name: 發佈到 Releases(手機可直接下載)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-v${{ github.run_number }}
          name: 雲筆記 APK v1.0.${{ github.run_number }}
          make_latest: true
          files: CloudNotes.apk
          body: |
            手機下載:https://github.com/${{ github.repository }}/releases/latest/download/CloudNotes.apk
