<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2f6fed">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<title>雲筆記</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--text:#1d2129;--sub:#6b7280;--line:#e5e7eb;--accent:#2f6fed;--danger:#d93025}
@media (prefers-color-scheme:dark){:root{--bg:#121316;--card:#1c1e23;--text:#e8eaed;--sub:#9aa0a6;--line:#2c2f36;--accent:#7aa7ff;--danger:#f28b82}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(10px + env(safe-area-inset-top)) 16px 8px}
.bar{display:flex;align-items:center;gap:4px}
.bar h1{font-size:20px;margin:0;flex:1}
.ib{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:18px;flex:none}
.ib:active{background:var(--line)}
.ib[disabled]{opacity:.3}
#search{width:100%;margin-top:8px;padding:10px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--text);font:inherit}
#status{font-size:12px;color:var(--sub);margin:6px 2px 0;min-height:16px}
main{padding:4px 16px 100px}
.note{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:10px 0}
.note:active{opacity:.7}
.note h3{margin:0 0 4px;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.note p{margin:0;font-size:14px;color:var(--sub);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-wrap}
.note small{display:block;margin-top:6px;font-size:12px;color:var(--sub)}
.thumb{margin-top:6px;border-radius:8px;overflow:hidden;background:#fff;border:1px solid var(--line)}
.thumb svg{display:block;width:100%;height:auto}
.empty{text-align:center;color:var(--sub);margin-top:60px}
#fab{position:fixed;right:20px;bottom:calc(24px + env(safe-area-inset-bottom));width:58px;height:58px;border-radius:18px;background:var(--accent);color:#fff;font-size:30px;box-shadow:0 4px 14px rgba(0,0,0,.25);z-index:4}
.ed{position:fixed;inset:0;background:var(--bg);display:none;flex-direction:column;z-index:10}
.ed.open{display:flex}
.ed .bar{padding:calc(8px + env(safe-area-inset-top)) 8px 4px}
.ttl{flex:1;min-width:0;border:0;background:none;color:var(--text);font:inherit;font-size:18px;font-weight:600;padding:8px;outline:none}
#etitle{border:0;background:none;color:var(--text);font:inherit;font-size:20px;font-weight:600;padding:8px 16px;outline:none}
#ebody{flex:1;border:0;background:none;color:var(--text);font:inherit;font-size:16px;line-height:1.6;padding:8px 16px calc(16px + env(safe-area-inset-bottom));resize:none;outline:none}
#inkWrap{flex:1;overflow-y:auto;overflow-x:hidden;background:#d9dce1;overscroll-behavior:contain}
#cv{display:block;background:#fff;touch-action:none;margin:0 auto}
.tools{display:flex;gap:4px;align-items:center;overflow-x:auto;padding:6px 8px calc(6px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--bg);scrollbar-width:none}
.tools::-webkit-scrollbar{display:none}
.tb{flex:none;min-width:42px;height:42px;padding:0 10px;border-radius:12px;display:grid;place-items:center;font-size:15px;white-space:nowrap}
.tb.on{background:var(--accent);color:#fff}
.tb:active{opacity:.7}
.tb[disabled]{opacity:.3}
.sep{flex:none;width:1px;height:24px;background:var(--line);margin:0 4px}
.dot{flex:none;width:30px;height:30px;border-radius:50%;border:3px solid transparent;background-clip:padding-box;box-shadow:inset 0 0 0 1px rgba(0,0,0,.2)}
.dot.on{border-color:var(--accent)}
#mmWrap{flex:1;position:relative;overflow:hidden;background:var(--card);touch-action:none}
#mm{width:100%;height:100%;display:block;touch-action:none;user-select:none;-webkit-user-select:none}
#mm text{font-size:15px;fill:var(--text);pointer-events:none}
.mn rect{cursor:pointer}
dialog{border:1px solid var(--line);border-radius:16px;background:var(--card);color:var(--text);width:min(92vw,420px);padding:18px}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog h2{margin:0 0 10px;font-size:18px}
dialog label{display:block;font-size:13px;color:var(--sub);margin:12px 0 4px}
dialog input{width:100%;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text);font:inherit}
dialog .row{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.btn{padding:9px 16px;border-radius:10px;background:var(--line)}
.btn.p{background:var(--accent);color:#fff}
.hint{font-size:12px;color:var(--sub);line-height:1.5;margin-top:8px}
.nt{display:flex;align-items:center;gap:12px;width:100%;padding:14px;border-radius:12px;background:var(--bg);margin-top:8px;text-align:left;font-size:16px}
.nt span{font-size:24px}
.nt small{display:block;color:var(--sub);font-size:12px}
.tb.rec{background:var(--danger);color:#fff}
.tb[hidden]{display:none}
.inrow{display:flex;gap:6px;align-items:center}
.inrow input{flex:1}
#toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);background:rgba(30,30,30,.92);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;z-index:50;max-width:88vw;text-align:center;display:none}
</style>
</head>
<body>
<header>
  <div class="bar">
    <h1>雲筆記</h1>
    <button class="ib" id="syncBtn" title="同步 Google Drive">☁️</button>
    <button class="ib" id="setBtn" title="設定">⚙️</button>
  </div>
  <input id="search" type="search" placeholder="搜尋筆記">
  <div id="status"></div>
</header>
<main id="list"></main>
<button id="fab" aria-label="新增筆記">＋</button>

<!-- 文字編輯 -->
<section id="editor" class="ed" data-type="text">
  <div class="bar">
    <button class="ib" data-back aria-label="返回">←</button>
    <span style="flex:1"></span>
    <button class="tb" id="langBtn">中文</button>
    <button class="tb" id="micBtn" aria-label="語音輸入">🎤</button>
    <button class="ib" data-del aria-label="刪除">🗑️</button>
  </div>
  <input id="etitle" placeholder="標題">
  <textarea id="ebody" placeholder="開始輸入…"></textarea>
</section>

<!-- 手寫編輯 -->
<section id="inkEd" class="ed" data-type="ink">
  <div class="bar">
    <button class="ib" data-back aria-label="返回">←</button>
    <input class="ttl" id="inkTitle" placeholder="標題">
    <button class="ib" id="undoBtn" aria-label="復原">↶</button>
    <button class="ib" id="redoBtn" aria-label="重做">↷</button>
    <button class="ib" data-del aria-label="刪除">🗑️</button>
  </div>
  <div id="inkWrap"><canvas id="cv"></canvas></div>
  <div class="tools" id="inkTools">
    <button class="tb on" data-tool="pen">✏️ 筆</button>
    <button class="tb" data-tool="hl">🖍️ 螢光</button>
    <button class="tb" data-tool="eraser">🧽 橡皮</button>
    <button class="tb" data-tool="hand">✋ 移動</button>
    <button class="tb" data-tool="img">🖼️ 移圖</button>
    <span class="sep"></span>
    <span id="dots"></span>
    <span class="sep"></span>
    <button class="tb" data-w="3">細</button>
    <button class="tb on" data-w="5">中</button>
    <button class="tb" data-w="9">粗</button>
    <button class="tb on" id="prBtn">壓感</button>
    <span class="sep"></span>
    <button class="tb" id="imgBtn">＋圖片</button>
    <button class="tb" id="imgSm" hidden>圖－</button>
    <button class="tb" id="imgBg" hidden>圖＋</button>
    <button class="tb" id="imgDel" hidden>刪圖</button>
    <input type="file" id="imgFile" accept="image/*" multiple hidden>
    <span class="sep"></span>
    <button class="tb" id="bgBtn">橫線</button>
    <button class="tb" id="moreBtn">＋頁</button>
  </div>
</section>

<!-- 心智圖編輯 -->
<section id="mindEd" class="ed" data-type="mind">
  <div class="bar">
    <button class="ib" data-back aria-label="返回">←</button>
    <input class="ttl" id="mindTitle" placeholder="標題">
    <button class="ib" data-del aria-label="刪除">🗑️</button>
  </div>
  <div id="mmWrap"><svg id="mm" xmlns="http://www.w3.org/2000/svg"><g id="mmg"></g></svg></div>
  <div class="tools" id="mindTools">
    <button class="tb" id="mChild">＋子節點</button>
    <button class="tb" id="mSib">＋同層</button>
    <button class="tb" id="mEdit">✎ 編輯</button>
    <button class="tb" id="mCol">折疊</button>
    <button class="tb" id="mDel">🗑 刪除</button>
    <span class="sep"></span>
    <button class="tb" id="mOut">－</button>
    <button class="tb" id="mIn">＋</button>
    <button class="tb" id="mFit">置中</button>
  </div>
</section>

<dialog id="newDlg">
  <h2>新增筆記</h2>
  <button class="nt" data-new="text"><span>📝</span><div>文字筆記<small>用鍵盤輸入</small></div></button>
  <button class="nt" data-new="ink"><span>✍️</span><div>手寫筆記<small>手指或觸控筆書寫、畫圖</small></div></button>
  <button class="nt" data-new="mind"><span>🧠</span><div>心智圖<small>用節點整理想法</small></div></button>
  <div class="row"><button class="btn" id="newCancel">取消</button></div>
</dialog>

<dialog id="nodeDlg">
  <h2>節點文字</h2>
  <div class="inrow"><input id="nodeInp" maxlength="200" autocomplete="off"><button class="tb" id="nodeMic" aria-label="語音輸入">🎤</button></div>
  <div class="row"><button class="btn" id="nodeCancel">取消</button><button class="btn p" id="nodeOk">確定</button></div>
</dialog>

<dialog id="dlg">
  <h2>Google Drive 同步設定</h2>
  <label for="cid">OAuth 用戶端 ID</label>
  <input id="cid" placeholder="xxxxxxxx.apps.googleusercontent.com" autocomplete="off">
  <div class="hint">到 Google Cloud Console 建立「網頁應用程式」類型的 OAuth 用戶端 ID,並把本 App 網址加入「已授權的 JavaScript 來源」。筆記會存成你雲端硬碟中的 notes-sync.json,App 只能存取它自己建立的檔案。</div>
  <div class="row">
    <button class="btn" id="exportBtn">匯出備份</button>
    <button class="btn" id="cancel">取消</button>
    <button class="btn p" id="save">儲存</button>
  </div>
</dialog>

<div id="toast"></div>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script>
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const KEY = 'cloudnotes.v1', CID_KEY = 'cloudnotes.cid', FILE = 'notes-sync.json';
let notes = [];
let cur = null, token = null, tokenExp = 0, saveTimer = null, pushed = false;

const idb = {
  open() { return new Promise((res, rej) => { const r = indexedDB.open('cloudnotes', 1); r.onupgradeneeded = () => r.result.createObjectStore('kv'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); },
  async get(k) { const db = await this.open(); return new Promise((res, rej) => { const q = db.transaction('kv').objectStore('kv').get(k); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); }); },
  async set(k, v) { const db = await this.open(); return new Promise((res, rej) => { const t = db.transaction('kv', 'readwrite'); t.objectStore('kv').put(v, k); t.oncomplete = () => res(); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error); }); }
};
let wT = null, loaded = false;
function flush() {
  clearTimeout(wT);
  if (!loaded) return;
  idb.set('notes', notes).then(() => { try { localStorage.removeItem(KEY); } catch (e) {} })
    .catch(() => { try { localStorage.setItem(KEY, JSON.stringify(notes)); } catch (e) { setStatus('儲存空間不足'); } });
}
const persist = () => { clearTimeout(wT); wT = setTimeout(flush, 250); };
addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') flush(); });
addEventListener('pagehide', flush);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const setStatus = t => $('#status').textContent = t || '';
const fmt = ts => new Date(ts).toLocaleString('zh-TW', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' });
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const okColor = c => /^#[0-9a-f]{6}$/i.test(c) ? c : '#1d2129';
const typeOf = n => n.type || 'text';
const touch = () => { if (cur) { cur.updatedAt = Date.now(); persist(); } };
const touchSoon = () => { clearTimeout(saveTimer); saveTimer = setTimeout(touch, 400); };
let toastT = null;
function toast(t) { const el = $('#toast'); el.textContent = t; el.style.display = 'block'; clearTimeout(toastT); toastT = setTimeout(() => { el.style.display = 'none'; }, 2800); }

/* ---------- 列表 ---------- */
function inkThumb(n) {
  const strokes = (n.ink && n.ink.strokes) || [];
  const H = 460; let d = '';
  for (const m of (n.ink && n.ink.imgs) || []) {
    if (m.y < H + 40 && /^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+\/=]+$/.test(m.d))
      d += `<image href="${m.d}" x="${Math.round(m.x)}" y="${Math.round(m.y)}" width="${Math.round(m.w)}" height="${Math.round(m.h)}"/>`;
  }
  for (const s of strokes) {
    if (!s.p || !s.p.length || s.p[0][1] > H + 40) continue;
    const c = okColor(s.c), w = (s.t === 'h' ? s.w * 5 : s.w) || 4, op = s.t === 'h' ? .38 : 1;
    const pts = s.p.map(p => Math.round(p[0]) + ' ' + Math.round(p[1]));
    d += `<path d="M${pts[0]}${pts.length > 1 ? 'L' + pts.slice(1).join('L') : 'l0 .1'}" stroke="${c}" stroke-width="${w}" stroke-opacity="${op}" fill="none" stroke-linecap="round" stroke-linejoin="round"/>`;
  }
  return `<svg viewBox="0 0 1000 ${H}" preserveAspectRatio="xMidYMin slice">${d}</svg>`;
}

function render() {
  const q = $('#search').value.trim().toLowerCase();
  const text = n => (n.title + ' ' + (typeOf(n) === 'mind' ? Object.values(n.mind.nodes).map(x => x.t).join(' ') : n.body || '')).toLowerCase();
  const items = notes.filter(n => !n.deleted && (!q || text(n).includes(q))).sort((a, b) => b.updatedAt - a.updatedAt);
  const box = $('#list');
  box.innerHTML = '';
  if (!items.length) { box.innerHTML = '<div class="empty">' + (q ? '找不到符合的筆記' : '還沒有筆記,點右下角 ＋ 新增') + '</div>'; return; }
  for (const n of items) {
    const t = typeOf(n);
    const d = document.createElement('div');
    d.className = 'note';
    const h = document.createElement('h3');
    h.textContent = (t === 'ink' ? '✍️ ' : t === 'mind' ? '🧠 ' : '') + (n.title || (t === 'text' ? '(無標題)' : t === 'ink' ? '手寫筆記' : '心智圖'));
    d.append(h);
    if (t === 'text') { const p = document.createElement('p'); p.textContent = n.body || ''; d.append(p); }
    else if (t === 'ink') { const w = document.createElement('div'); w.className = 'thumb'; w.innerHTML = inkThumb(n); d.append(w); }
    else { const p = document.createElement('p'); const cnt = Object.keys(n.mind.nodes).length; p.textContent = (n.mind.nodes[n.mind.root].t || '') + ' · 共 ' + cnt + ' 個節點'; d.append(p); }
    const s = document.createElement('small'); s.textContent = fmt(n.updatedAt);
    d.append(s);
    d.onclick = () => openNote(n);
    box.append(d);
  }
}

/* ---------- 開啟 / 關閉 ---------- */
function newNote(type) {
  const n = { id: uid(), type, title: '', body: '', updatedAt: Date.now(), deleted: false };
  if (type === 'ink') n.ink = { h: 1400, bg: 'lines', strokes: [] };
  if (type === 'mind') { const r = uid(); n.mind = { root: r, nodes: { [r]: { id: r, t: '中心主題', p: null, ch: [], col: false } }, v: null }; }
  notes.push(n);
  openNote(n);
}

function isEmpty(n) {
  const t = typeOf(n);
  if (n.title) return false;
  if (t === 'text') return !n.body;
  if (t === 'ink') return !n.ink.strokes.length;
  const ks = Object.keys(n.mind.nodes);
  return ks.length === 1 && n.mind.nodes[n.mind.root].t === '中心主題';
}

function openNote(n) {
  cur = n;
  const t = typeOf(n);
  history.pushState({ ed: 1 }, ''); pushed = true;
  if (t === 'text') { $('#etitle').value = n.title; $('#ebody').value = n.body; $('#editor').classList.add('open'); if (!n.title && !n.body) $('#ebody').focus(); }
  if (t === 'ink') { $('#inkTitle').value = n.title; $('#inkEd').classList.add('open'); startInk(); }
  if (t === 'mind') { $('#mindTitle').value = n.title; $('#mindEd').classList.add('open'); startMind(); }
}

function commit() {
  if (!cur || cur.deleted) return;
  const t = typeOf(cur);
  if (t === 'text') {
    const ti = $('#etitle').value, b = $('#ebody').value;
    if (ti !== cur.title || b !== cur.body) { cur.title = ti; cur.body = b; cur.updatedAt = Date.now(); }
  } else {
    const ti = (t === 'ink' ? $('#inkTitle') : $('#mindTitle')).value;
    if (ti !== cur.title) { cur.title = ti; cur.updatedAt = Date.now(); }
  }
  persist();
}

function closeEditor() {
  stopVoice();
  clearTimeout(saveTimer);
  commit();
  if (cur && !cur.deleted && isEmpty(cur)) notes = notes.filter(n => n.id !== cur.id);
  cur = null; pushed = false; persist();
  $$('.ed').forEach(e => e.classList.remove('open'));
  render();
  autoSync();
}

function goBack() { if (pushed) history.back(); else closeEditor(); }
addEventListener('popstate', () => { if (cur) closeEditor(); });
$$('[data-back]').forEach(b => b.onclick = goBack);
$$('[data-del]').forEach(b => b.onclick = () => {
  if (!cur || !confirm('要刪除這則筆記嗎?')) return;
  cur.deleted = true; cur.title = ''; cur.body = ''; cur.updatedAt = Date.now();
  if (cur.ink) cur.ink = { h: 1400, bg: 'blank', strokes: [] };
  if (cur.mind) { const r = uid(); cur.mind = { root: r, nodes: { [r]: { id: r, t: '', p: null, ch: [], col: false } }, v: null }; }
  persist(); goBack();
});

['#etitle', '#ebody', '#inkTitle', '#mindTitle'].forEach(s => $(s).addEventListener('input', () => { clearTimeout(saveTimer); saveTimer = setTimeout(commit, 400); }));

$('#fab').onclick = () => $('#newDlg').showModal();
$('#newCancel').onclick = () => $('#newDlg').close();
$$('[data-new]').forEach(b => b.onclick = () => { $('#newDlg').close(); newNote(b.dataset.new); });
$('#search').oninput = render;

/* ---------- 手寫 ---------- */
const INK_W = 1000, PALETTE = ['#1d2129', '#d93025', '#2f6fed', '#1e8e3e', '#f29900', '#9334e6'];
const cv = $('#cv'), ctx = cv.getContext('2d');
let ink = null, scale = 1, dpr = 1, tool = 'pen', color = PALETTE[0], pw = 5, hasPen = false;
let undoS = [], redoS = [], drawing = null, erasing = null, touches = new Map(), panLast = null;

$('#dots').style.display = 'contents';
$('#dots').innerHTML = PALETTE.map((c, i) => `<button class="dot${i ? '' : ' on'}" data-c="${c}" style="background:${c}" aria-label="顏色"></button>`).join('');

let usePr = localStorage.getItem('cloudnotes.pr') !== '0', imgSel = null, imgDrag = null;
function startInk() {
  ink = cur.ink; if (!ink.imgs) ink.imgs = []; imgSel = null; imgDrag = null; undoS = []; redoS = []; drawing = null; erasing = null; touches.clear();
  $('#inkWrap').scrollTop = 0;
  sizeCanvas(); updInkUI();
}

function sizeCanvas() {
  if (!ink) return;
  const w = $('#inkWrap').clientWidth;
  if (!w) return;
  scale = w / INK_W; dpr = window.devicePixelRatio || 1;
  cv.style.width = w + 'px'; cv.style.height = ink.h * scale + 'px';
  cv.width = Math.round(w * dpr); cv.height = Math.round(ink.h * scale * dpr);
  redraw();
}
addEventListener('resize', () => { if (cur && cur.ink) sizeCanvas(); });

const prW = pr => .35 + 1.3 * pr;
function drawStroke(s) {
  const p = s.p; if (!p || !p.length) return;
  ctx.save();
  ctx.lineCap = ctx.lineJoin = 'round';
  ctx.strokeStyle = ctx.fillStyle = okColor(s.c);
  ctx.globalAlpha = s.t === 'h' ? .38 : 1;
  if (s.pv && s.t !== 'h') {
    if (p.length === 1) { ctx.beginPath(); ctx.arc(p[0][0], p[0][1], s.w * prW(p[0][2] || .5) / 2, 0, 6.2832); ctx.fill(); }
    else for (let i = 1; i < p.length; i++) {
      ctx.lineWidth = s.w * prW(((p[i - 1][2] || .5) + (p[i][2] || .5)) / 2);
      ctx.beginPath(); ctx.moveTo(p[i - 1][0], p[i - 1][1]); ctx.lineTo(p[i][0], p[i][1]); ctx.stroke();
    }
    ctx.restore(); return;
  }

    const g = ink.bg === 'grid' ? 50 : 56;
    for (let y = g; y < ink.h; y += g) { ctx.moveTo(0, y); ctx.lineTo(INK_W, y); }
    if (ink.bg === 'grid') for (let x = g; x < INK_W; x += g) { ctx.moveTo(x, 0); ctx.lineTo(x, ink.h); }

    if (m) { ctx.save(); ctx.strokeStyle = '#2f6fed'; ctx.lineWidth = 3 / scale; ctx.setLineDash([10 / scale, 6 / scale]); ctx.strokeRect(m.x, m.y, m.w, m.h); ctx.restore(); }

async function addImageFile(file) {
  if (!ink || !file || !/^image\//.test(file.type)) { toast('這不是圖片檔'); return; }
  toast('處理圖片中…');
  try {
    const url = URL.createObjectURL(file);
    const im = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error('無法讀取這張圖片(可能格式不支援)')); i.src = url; });
    const k = Math.min(1, 1400 / Math.max(im.naturalWidth, im.naturalHeight));
    const c = document.createElement('canvas');
    c.width = Math.max(1, Math.round(im.naturalWidth * k)); c.height = Math.max(1, Math.round(im.naturalHeight * k));
    const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); g.drawImage(im, 0, 0, c.width, c.height);
    URL.revokeObjectURL(url);
    const d = c.toDataURL('image/jpeg', .78);
    const w = 760, h = w * c.height / c.width;
    const y = Math.max(20, Math.round($('#inkWrap').scrollTop / scale + 30));
    if (y + h + 120 > ink.h) ink.h = Math.ceil(y + h + 200);
    const m = { id: uid(), x: (INK_W - w) / 2, y, w, h: Math.round(h), d };
    (ink.imgs || (ink.imgs = [])).push(m);
    imgSel = m.id; tool = 'img'; touch(); sizeCanvas(); updInkUI(); toast('圖片已加入,可拖曳移動');
  } catch (e) { toast(e.message || '圖片加入失敗'); }
}

function curImg() { return (ink.imgs || []).find(x => x.id === imgSel); }
function scaleImg(f) {
  const m = curImg(); if (!m) return;
  const cx = m.x + m.w / 2, cy = m.y + m.h / 2, w = Math.min(1400, Math.max(80, m.w * f)), h = m.h * (w / m.w);
  m.x = cx - w / 2; m.y = cy - h / 2; m.w = w; m.h = Math.round(h); touch(); redraw();
}

  ink.imgs = ink.imgs.filter(x => x !== m); imgCache.delete(m.id); imgSel = null; touch(); redraw(); updInkUI();
};

}

const NH = 36, GAPY = 14, GAPX = 48, MPAL = ['#2f6fed', '#e8590c', '#2b8a3e', '#ae3ec9', '#c2255c', '#0c8599'];
const mctx = document.createElement('canvas').getContext('2d');
const sv = $('#mm'), mg = $('#mmg');
let M = null, sel = null, mpos = {}, lastTap = { id: null, t: 0 };

const label = t => t.length > 18 ? t.slice(0, 18) + '…' : t;
const measure = t => { mctx.font = '15px system-ui,"Noto Sans TC",sans-serif'; return Math.min(240, Math.max(64, mctx.measureText(label(t)).width + 28)); };

function layout() {
  const pos = {}; let leaf = 0;
  (function rec(id, x) {
    const n = M.nodes[id], w = measure(n.t), kids = n.col ? [] : n.ch;
    let y;
    if (!kids.length) { y = leaf * (NH + GAPY); leaf++; }
    else { const ys = kids.map(k => rec(k, x + w + GAPX)); y = (ys[0] + ys[ys.length - 1]) / 2; }
    pos[id] = { x, y, w }; return y;
  })(M.root, 0);
  return pos;
}

function colorOf(id) {
  if (id === M.root) return null;
  let n = M.nodes[id];
  while (n.p !== M.root) n = M.nodes[n.p];
  return MPAL[M.nodes[M.root].ch.indexOf(n.id) % MPAL.length];
}

function renderMind() {
  mpos = layout();
  let links = '', nodes = '';
  for (const id in mpos) {
    const n = M.nodes[id], p = mpos[id], c = colorOf(id), root = id === M.root;
    for (const k of (n.col ? [] : n.ch)) {
      const q = mpos[k], x1 = p.x + p.w, y1 = p.y + NH / 2, y2 = q.y + NH / 2;
      links += `<path d="M${x1} ${y1}C${x1 + 24} ${y1} ${q.x - 24} ${y2} ${q.x} ${y2}" fill="none" stroke="${colorOf(k)}" stroke-width="2.5" stroke-linecap="round"/>`;
    }
    const stroke = id === sel ? 'var(--text)' : (c || 'var(--accent)');
    nodes += `<g class="mn" data-id="${id}"><rect x="${p.x}" y="${p.y}" width="${p.w}" height="${NH}" rx="10" fill="${c || 'var(--accent)'}" fill-opacity="${root ? .92 : .16}" stroke="${stroke}" stroke-width="${id === sel ? 3 : 1.5}"/>` +
      `<text x="${p.x + p.w / 2}" y="${p.y + NH / 2}" text-anchor="middle" dominant-baseline="central"${root ? ' style="fill:#fff"' : ''}>${esc(label(n.t))}</text>` +
      (n.col && n.ch.length ? `<circle cx="${p.x + p.w + 11}" cy="${p.y + NH / 2}" r="10" fill="${c || 'var(--accent)'}"/><text x="${p.x + p.w + 11}" y="${p.y + NH / 2}" text-anchor="middle" dominant-baseline="central" style="font-size:11px;fill:#fff">${n.ch.length}</text>` : '') + '</g>';
  }
  mg.innerHTML = links + nodes;
  const has = sel && M.nodes[sel], isRoot = sel === M.root;
  $('#mChild').disabled = !has; $('#mSib').disabled = !has || isRoot; $('#mEdit').disabled = !has;
  $('#mDel').disabled = !has || isRoot;
  $('#mCol').disabled = !has || !M.nodes[sel].ch.length;
  $('#mCol').textContent = has && M.nodes[sel].col ? '展開' : '折疊';
}

function applyView() { const v = M.v; mg.setAttribute('transform', `translate(${v.x} ${v.y}) scale(${v.k})`); }
function fitView() {
  const r = sv.getBoundingClientRect(), p = mpos[M.root];

}

}

function openNode(id, isNew) {

$('#mOut').onclick = () => { const r = sv.getBoundingClientRect(); zoomAt(r.left + r.width / 2, r.top + r.height / 2, M.v.k / 1.25); persist(); };

const mp = new Map(); let mPan = null, mPinch = null, tapNode = null, mMoved = false;
sv.addEventListener('pointerdown', e => {
  sv.setPointerCapture(e.pointerId);
  mp.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (mp.size === 1) { mPan = { x: e.clientX, y: e.clientY }; tapNode = e.target.closest ? e.target.closest('.mn') : null; mMoved = false; }
  else if (mp.size === 2) {
    tapNode = null; mMoved = true; mPan = null;
    const [a, b] = [...mp.values()];
    mPinch = { d: Math.hypot(a.x - b.x, a.y - b.y) || 1, k: M.v.k };
  }
});
sv.addEventListener('pointermove', e => {
  if (!mp.has(e.pointerId)) return;
  mp.set(e.pointerId, { x: e.clientX, y: e.clientY });

  } else if (mPan) {

  }
});
function mEnd(e) {
  mp.delete(e.pointerId);
  if (mp.size === 1) { const r = [...mp.values()][0]; mPan = { x: r.x, y: r.y }; mPinch = null; mMoved = true; return; }
  if (mp.size === 0) {
    if (e.type === 'pointerup' && !mMoved) {
      if (tapNode) {
        const id = tapNode.dataset.id, now = Date.now();
        if (lastTap.id === id && now - lastTap.t < 380) { sel = id; renderMind(); openNode(id); lastTap = { id: null, t: 0 }; }
        else { sel = id; renderMind(); lastTap = { id, t: now }; }

sv.addEventListener('pointercancel', mEnd);
sv.addEventListener('wheel', e => { if (!M) return; e.preventDefault(); zoomAt(e.clientX, e.clientY, M.v.k * (e.deltaY < 0 ? 1.1 : 1 / 1.1)); }, { passive: false });

/* ---------- Google Drive 同步 ---------- */
const cid = () => localStorage.getItem(CID_KEY) || '';

function getToken(interactive) {
  return new Promise((resolve, reject) => {
    if (token && Date.now() < tokenExp - 60000) return resolve(token);
    if (!window.google || !google.accounts) return reject(new Error('Google 登入元件尚未載入,請確認網路'));
    if (!cid()) return reject(new Error('請先到 ⚙️ 設定填入 OAuth 用戶端 ID'));
    const tc = google.accounts.oauth2.initTokenClient({
      client_id: cid(),
      scope: 'https://www.googleapis.com/auth/drive.file',
      callback: r => {
        if (r.error) return reject(new Error(r.error));
        token = r.access_token; tokenExp = Date.now() + r.expires_in * 1000;
        localStorage.setItem('cloudnotes.linked', '1');
        resolve(token);
      },
      error_callback: e => reject(new Error(e.type || '授權失敗'))
    });
    tc.requestAccessToken({ prompt: interactive ? 'consent' : '' });
  });
}

async function api(url, opts = {}) {
  const r = await fetch(url, { ...opts, headers: { Authorization: 'Bearer ' + token, ...(opts.headers || {}) } });
  if (!r.ok) throw new Error('Drive 錯誤 ' + r.status);
  return r;
}

function merge(local, remote) {
  const map = new Map();
  for (const n of [...local, ...remote]) {
    const o = map.get(n.id);
    if (!o || n.updatedAt > o.updatedAt) map.set(n.id, n);
  }
  return [...map.values()];
}

let syncing = false;
async function sync(interactive) {
  if (syncing) return;
  syncing = true; setStatus('同步中…');
  try {
    await getToken(interactive);
    const q = encodeURIComponent(`name='${FILE}' and trashed=false`);
    const found = await (await api(`https://www.googleapis.com/drive/v3/files?q=${q}&fields=files(id)`)).json();
    let id = found.files[0] && found.files[0].id, remote = [];
    if (id) {
      try { remote = (await (await api(`https://www.googleapis.com/drive/v3/files/${id}?alt=media`)).json()).notes || []; } catch (e) { remote = []; }
    }
    commit();
    const openId = cur && cur.id;
    notes = merge(notes, remote);
    const cutoff = Date.now() - 30 * 864e5;
    notes = notes.filter(n => !(n.deleted && n.updatedAt < cutoff));
    if (openId) cur = notes.find(n => n.id === openId) || cur;
    persist(); render();
    const body = JSON.stringify({ version: 2, notes });
    if (id) {
      await api(`https://www.googleapis.com/upload/drive/v3/files/${id}?uploadType=media`, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body });
    } else {
      const bd = 'b' + uid();
      const mpart = `--${bd}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify({ name: FILE, mimeType: 'application/json' })}\r\n--${bd}\r\nContent-Type: application/json\r\n\r\n${body}\r\n--${bd}--`;
      await api('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart', { method: 'POST', headers: { 'Content-Type': 'multipart/related; boundary=' + bd }, body: mpart });
    }
    setStatus('已同步 ' + new Date().toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit' }));
  } catch (e) {
    setStatus('同步失敗:' + e.message);
  } finally { syncing = false; }
}

function autoSync() {
  if (localStorage.getItem('cloudnotes.linked') && token && Date.now() < tokenExp - 60000) sync(false);
}
$('#syncBtn').onclick = () => sync(!token);

/* ---------- 語音輸入 ---------- */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const LANGS = [['zh-TW', '中文'], ['en-US', 'English'], ['ja-JP', '日本語']];
const ANDROID = /Android/i.test(navigator.userAgent);
let langI = Math.min(LANGS.length - 1, Math.max(0, +localStorage.getItem('cloudnotes.lang') || 0)), voice = null;
function showLang() { $('#langBtn').textContent = LANGS[langI][1]; }
function stopVoice() {
  if (!voice) return;
  const v = voice; voice = null; v.btn.classList.remove('rec');
  try { v.rec && v.rec.abort(); } catch (e) {}
}
function startVoice(el, btn) {
  if (!SR) { toast('這個瀏覽器不支援語音輸入,請用 Android 版 Chrome'); return; }
  const v = voice = { el, btn, rec: null, pos: el.selectionStart == null ? el.value.length : el.selectionStart, len: 0 };
  btn.classList.add('rec');
  const begin = () => {
    if (voice !== v) return;
    const r = new SR(); v.rec = r;
    r.lang = LANGS[langI][0]; r.continuous = !ANDROID; r.interimResults = true;
    r.onresult = ev => {
      let t = ''; for (let i = 0; i < ev.results.length; i++) t += ev.results[i][0].transcript;
      const val = el.value; el.value = val.slice(0, v.pos) + t + val.slice(v.pos + v.len); v.len = t.length;
      const c = v.pos + v.len; try { el.setSelectionRange(c, c); } catch (e) {}
      el.dispatchEvent(new Event('input', { bubbles: true }));
    };
    r.onerror = ev => {
      if (ev.error === 'not-allowed' || ev.error === 'service-not-allowed') { toast('請允許麥克風權限後再試一次'); stopVoice(); }
      else if (ev.error === 'network') { toast('語音辨識需要網路連線'); stopVoice(); }
    };
    r.onend = () => { if (voice !== v) return; v.pos += v.len; v.len = 0; setTimeout(begin, 150); };
    try { r.start(); } catch (e) { stopVoice(); }
  };
  begin();
  toast('請開始說話(' + LANGS[langI][1] + ')');
}
function toggleVoice(el, btn) { if (voice && voice.btn === btn) stopVoice(); else { stopVoice(); startVoice(el, btn); } }
$('#langBtn').onclick = () => {
  langI = (langI + 1) % LANGS.length; localStorage.setItem('cloudnotes.lang', langI); showLang();
  if (voice) { const { el, btn } = voice; stopVoice(); startVoice(el, btn); }
};
showLang();
$('#micBtn').onclick = () => toggleVoice($('#ebody'), $('#micBtn'));
$('#nodeMic').onclick = () => toggleVoice($('#nodeInp'), $('#nodeMic'));
$('#nodeDlg').addEventListener('close', stopVoice);

/* ---------- 設定 / 匯出 ---------- */
$('#setBtn').onclick = () => { $('#cid').value = cid(); $('#dlg').showModal(); };
$('#cancel').onclick = () => $('#dlg').close();
$('#save').onclick = () => { localStorage.setItem(CID_KEY, $('#cid').value.trim()); token = null; $('#dlg').close(); setStatus('設定已儲存,點 ☁️ 開始同步'); };
$('#exportBtn').onclick = () => {
  const blob = new Blob([JSON.stringify({ notes: notes.filter(n => !n.deleted) }, null, 2)], { type: 'application/json' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'notes-backup.json'; a.click();
};

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
(async () => {
  let v;
  try { v = await idb.get('notes'); } catch (e) {}
  if (Array.isArray(v)) notes = v;
  else { try { notes = JSON.parse(localStorage.getItem(KEY) || '[]'); } catch (e) { notes = []; } }
  loaded = true;
  if (!Array.isArray(v)) flush();
  render();
})();
</script>
