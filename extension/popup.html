<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<style>
body{width:290px;margin:0;padding:14px;font:14px/1.4 system-ui,"Noto Sans TC",sans-serif;color:#1d2129}
h1{font-size:15px;margin:0 0 10px}
button.act{display:flex;width:100%;align-items:center;gap:8px;padding:10px;margin-bottom:6px;border:1px solid #d9dee7;border-radius:10px;background:#fff;font-size:14px;cursor:pointer;text-align:left}
button.act:hover{background:#f1f5ff;border-color:#2f6fed}
button.act small{display:block;color:#7a828e;font-size:11px}
input{width:100%;box-sizing:border-box;padding:8px;border:1px solid #d9dee7;border-radius:8px;margin:2px 0 8px;font-size:13px}
label{font-size:12px;color:#7a828e}
#st{min-height:20px;font-size:13px;margin-top:4px}
#st.err{color:#d93025}#st.ok{color:#188038}
</style></head><body>
<h1>📒 剪到雲筆記</h1>
<button class="act" data-k="article" style="border-color:#00a82d;background:#f0faf3">📄<span><b>文章</b><small>保留文字、圖片與排版,去掉廣告和留言</small></span></button>
<button class="act" data-k="selection">✂️<span>剪下選取的文字<small>先在網頁上反白文字</small></span></button>
<button class="act" data-k="full">🖼️<span>整頁截圖<small>捲動並拼接整個網頁(可再手寫標註)</small></span></button>
<button class="act" data-k="shot">📷<span>目前畫面截圖</span></button>
<button class="act" data-k="bookmark">🔖<span>只存書籤<small>標題、網址與摘要</small></span></button>
<label>額外標籤(用逗號分隔,選填)</label><input id="tags" placeholder="例如:人資, 法規">
<label>備註(選填)</label><input id="note" placeholder="為什麼要存這頁?">
<div id="st"></div>
<script src="popup.js"></script>
</body></html>
